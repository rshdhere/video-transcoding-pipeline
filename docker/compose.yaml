services:
  postgres:
    image: postgres:16-alpine
    container_name: vtp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vtp
      POSTGRES_PASSWORD: vtp
      POSTGRES_DB: vtp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtp -d vtp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
